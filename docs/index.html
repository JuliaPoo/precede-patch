<style>
    /* Styling for our custom on-screen error container */
    #error-log-display {
      background-color: #2c0000;
      color: #ff9999;
      font-family: monospace;
      padding: 15px;
      margin: 20px 0;
      border: 2px solid #ff3333;
      border-radius: 5px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .error-entry {
      border-bottom: 1px solid #551111;
      padding: 5px 0;
    }
  </style>

  <script>
    // Self-executing setup to run before any other script
    (function() {
      // Helper function to insert error messages into the DOM
      function logToHTML(message) {
        // Run after the DOM is fully interactive or loaded
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () => appendElement(message));
        } else {
          appendElement(message);
        }
      }

      function appendElement(text) {
        let container = document.getElementById('error-log-display');
        if (!container) {
          // Dynamically create the container if it doesn't exist yet
          container = document.createElement('div');
          container.id = 'error-log-display';
          document.body.insertBefore(container, document.body.firstChild);
        }
        const entry = document.createElement('div');
        entry.className = 'error-entry';
        entry.textContent = `❌ ${text}`;
        container.appendChild(entry);
      }

      // 1. Capture Unhandled Runtime Exceptions (e.g., syntax/reference errors)
      window.addEventListener('error', function(event) {
        // Avoid duplicate logging if error info is missing
        if (!event.message) return; 
        const errorMsg = `${event.message} (at ${event.filename}:${event.lineno}:${event.colno})`;
        logToHTML(errorMsg);
      });

      // 2. Capture Unhandled Promise Rejections (e.g., failed fetch requests)
      window.addEventListener('unhandledrejection', function(event) {
        const reason = event.reason && event.reason.message ? event.reason.message : event.reason;
        logToHTML(`Unhandled Promise Rejection: ${reason}`);
      });

      // 3. Intercept Explicit console.error() calls from code or third-party scripts
      const nativeConsoleError = console.error;
      console.error = function(...args) {
        // Convert arguments into a readable string format
        const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
        logToHTML(message);
        // Retain original console functionality in DevTools
        nativeConsoleError.apply(console, args); 
      };
    })();
  </script>
</head>

<body onload="init()">
    <div id="wrappa">
        <h1>[S]Prequel: Rufflebeds</h1>
        <select id="dropdabeatyall" onchange="run_rom()">
            <option value="">-- select rom plox --</option>
            <option value="excelsior-patch.swf">excelsior-patch.swf</option>
            <option value="excelsior-original.swf">excelsior-original.swf</option>
            <option value="precede-patch.swf">precede-patch.swf</option>
            <option value="precede-original.swf">precede-original.swf</option>
            <option value="precede-patch - low-quality.swf">precede-patch - low-quality.swf</option>
            <option value="precede-patch - scale2.swf">precede-patch - scale2.swf</option>
            <option value="precede-patch - scale19.swf">precede-patch - scale19.swf</option>
            <option value="precede-patch - alloc-hoist.swf">precede-patch - alloc-hoist.swf</option>
        </select>
        <div id="player-container">
        </div>

        <script>// sets volume slider to 50%
            var run_rom = () => {
                var ruffle = window.RufflePlayer.newest();
                var player = ruffle.createPlayer();
                var rom = document.getElementById("dropdabeatyall").value;
                if (rom === "") return;
                document.getElementById("player-container").appendChild(player);
                player.load(rom).then(function() {
                    var slider = player.shadowRoot.querySelector("#volume-slider");
                    slider.value = 50;
                    slider.dispatchEvent(new Event("input"));
                });
                document.getElementById("dropdabeatyall").style.display = "none";
            };
        </script>

        <style>
            html,
            body {
                margin: 0px;
                padding: 0px;
                background: black;
                height: 100%;
                overflow: visible;
                font-family: courier, monospace;
                color: #FFFFF0;
                text-align: center;
                touch-action: manipulation;
                user-select: none;
            }

            h1 {
                font-weight: bold;
                margin: 0px;
                flex-shrink: 0;
            }

            #wrappa {
                display: flex;
                flex-direction: column;
                box-sizing: content-box;
                width: min(100vw, 100vh);
                position: relative;
                margin: auto;
                height: 100vh;
                justify-content: center;
            }

            #player-container {
                display: flex;
                justify-content: center;
                align-items: center;
                flex: 1;
                min-height: 0;
                width: 100%;
            }

            ruffle-player {
                aspect-ratio: 800 / 550;
                display: block;
                width: auto;
                height: 100%;
                flex-grow: 3;
            }

            @media (max-aspect-ratio: 12/10) { /* detects narrow aspect ratio and vertically align elements to top */
                #wrappa {
                    justify-content: flex-start;
                    height: auto;
                    width: 100%;
                }

                h1 {
                    margin-top: 20px;
                }
            }
             /* if it's mobile and landscape mode */
            @media all and (orientation:landscape) and (hover: none) and (pointer: coarse) {
                h1 {
                    display:none;
                    height: 0;
                }
				p {
                    display:none;
                    height: 0;
                }
            }

            a {
                color: white;
            }

            p {
                flex-shrink: 0;
                color: #c7c7c7
            }
        </style>
